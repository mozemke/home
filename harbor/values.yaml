expose:
  tls:
    enabled: true
    certSource: none
  ingress:
    hosts:
      core: harbor.cluster.mzemke.net
    className: "nginx"

externalURL: https://harbor.cluster.mzemke.net

persistence:
  enabled: true
  persistentVolumeClaim:
    registry:
      storageClass: "longhorn"
    jobservice:
      jobLog:
        storageClass: "longhorn"
    database:
      storageClass: "longhorn"
    redis:
      storageClass: "longhorn"
    trivy:
      storageClass: "longhorn"

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: sandbox
  namespace: metallb-system
spec:
  # Single address on purpose: the kgateway LoadBalancer always gets it, and DNS points here.
  addresses:
  - 192.168.178.220/32
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default
  namespace: metallb-system
spec:
  ipAddressPools:
  - sandbox

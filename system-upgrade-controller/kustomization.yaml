apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - github.com/rancher/system-upgrade-controller?ref=v0.21.0
  - plan.yaml

# Upstream's own kustomization lags behind its release tag, so the image is pinned explicitly.
images:
  - name: rancher/system-upgrade-controller
    newTag: v0.21.0

patches:
  # Image used for cordon/drain. Upstream default is rancher/kubectl:v1.30.3, which is far
  # outside the supported skew for a v1.35+ cluster. v1.36.x covers apiservers 1.35 to 1.37.
  - target:
      kind: ConfigMap
      name: default-controller-env
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: default-controller-env
      data:
        SYSTEM_UPGRADE_JOB_KUBECTL_IMAGE: rancher/kubectl:v1.36.2

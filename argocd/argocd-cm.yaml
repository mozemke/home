apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
  name: argocd-cm
data:
  # Enables application status badge feature
  statusbadge.enabled: "true"
  accounts.dev: login,apiKey
  ui.cssurl: "./custom/styles.css"
  url: https://argocd.zemke.dev
  kustomize.buildOptions: "--enable-helm"
  resource.customizations: |
    bitnami.com/SealedSecret:
      health.lua: |
        hs = {}
        hs.status = "Healthy"
        hs.message = "Controller doesn't report resource status"
        return hs
  # SSO via Pocket ID (replaces the bundled Dex). The client secret is NOT in git:
  # it lives in the argocd-secret key "oidc.pocketid.clientSecret".
  # Redirect URI to register in Pocket ID: https://argocd.zemke.dev/auth/callback
  oidc.config: |
    name: Pocket ID
    issuer: https://id.zemke.dev
    clientID: a93d8a85-b300-4754-b774-cea838e86e5e
    clientSecret: $oidc.pocketid.clientSecret
    requestedScopes: ["openid", "profile", "email"]
    enablePKCEAuthentication: true

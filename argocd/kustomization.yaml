apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Since v3.3 the ApplicationSet CRD is too large for client-side apply. Install/upgrade with
#   kubectl apply -k argocd --server-side --force-conflicts
# (when Argo CD manages itself, the ApplicationSet in app/ sets ServerSideApply=true).
resources:
- https://github.com/argoproj/argo-cd//manifests/cluster-install/?ref=v3.6.1
- httproute.yaml


configMapGenerator:
- name: argocd-styles-cm
  files:
    - styles.css
  options:
    disableNameSuffixHash: true

patches:
- path: https://raw.githubusercontent.com/argoproj/argo-cd/v3.6.1/notifications_catalog/install.yaml
- path: argocd-cm.yaml
- path: argocd-rbac-cm.yaml 

- target:
    kind: ConfigMap
    name: argocd-cmd-params-cm
  patch: |-
      - op: add
        path: /data
        value: {dummy: "dummy"}
      - op: add
        path: /data/server.insecure
        value: "true"
      - op: remove
        path: /data/dummy

# Dex is no longer used (SSO goes straight to Pocket ID): drop the bundled Dex server.
- target: {kind: Deployment, name: argocd-dex-server}
  patch: |-
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: argocd-dex-server
- target: {kind: Service, name: argocd-dex-server}
  patch: |-
    $patch: delete
    apiVersion: v1
    kind: Service
    metadata:
      name: argocd-dex-server
- target: {kind: ServiceAccount, name: argocd-dex-server}
  patch: |-
    $patch: delete
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: argocd-dex-server
- target: {kind: Role, name: argocd-dex-server}
  patch: |-
    $patch: delete
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: argocd-dex-server
- target: {kind: RoleBinding, name: argocd-dex-server}
  patch: |-
    $patch: delete
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: argocd-dex-server
- target: {kind: NetworkPolicy, name: argocd-dex-server-network-policy}
  patch: |-
    $patch: delete
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: argocd-dex-server-network-policy

- target:
    kind: Deployment
    name: argocd-server
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/volumeMounts/-
      value:
        name: styles
        mountPath: /shared/app/custom
    - op: add
      path: /spec/template/spec/volumes/-
      value:
        name: styles
        configMap:
          name: argocd-styles-cm

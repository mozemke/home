apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
spec:
  dnsNames:
  - '*.cluster.mzemke.net'
  issuerRef:
    kind: ClusterIssuer
    name: mzemke-net-prod
  secretName: wildcard
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-dev
spec:
  dnsNames:
  - '*.zemke.dev'
  issuerRef:
    kind: ClusterIssuer
    name: mzemke-net-prod
  secretName: wildcard-dev
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zemke-dev
spec:
  dnsNames:
  - 'zemke.dev'
  issuerRef:
    kind: ClusterIssuer
    name: mzemke-net-prod
  secretName: zemke-dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Gateway API CRDs (standard channel) must match what the kgateway release supports:
# kgateway v2.5 -> Gateway API v1.7. Bump both together.
resources:
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.7.0/standard-install.yaml
  - namespace.yaml
  - gateway.yaml
  - certificates.yaml

helmCharts:
- name: kgateway-crds
  releaseName: kgateway-crds
  repo: oci://cr.kgateway.dev/kgateway-dev/charts
  namespace: kgateway-system
  version: v2.5.1
- name: kgateway
  releaseName: kgateway
  repo: oci://cr.kgateway.dev/kgateway-dev/charts
  namespace: kgateway-system
  version: v2.5.1

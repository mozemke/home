alertmanager:
  enabled: true

grafana:
  ingress:
    ingressClassName: nginx
    enabled: true
    hosts:
      - grafana.cluster.mzemke.net
    tls:
      - hosts:
        - grafana.cluster.mzemke.net

kube-state-metrics:
  releaseLabel: false

prometheus-node-exporter:
  releaseLabel: false

prometheus:
  prometheusSpec:
    logLevel: debug
